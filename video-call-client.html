<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vibe Call</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --accent: #7c6ff7;
    --accent2: #a78bfa;
    --green: #34d399;
    --red: #f87171;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: .5;
  }

  /* ---- SCREENS ---- */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 0;
    transition: opacity .35s, transform .35s;
    z-index: 1;
  }
  .screen.hidden { opacity: 0; pointer-events: none; transform: translateY(12px); }

  /* ---- HOME ---- */
  #homeScreen {
    gap: 0;
  }

  .logo {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 48px;
  }

  .home-headline {
    font-size: clamp(32px, 8vw, 52px);
    font-weight: 300;
    line-height: 1.15;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: -.02em;
  }
  .home-headline em {
    font-style: italic;
    color: var(--accent2);
  }

  .home-sub {
    font-size: 15px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 48px;
    font-weight: 300;
  }

  .my-id-box {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 20px 24px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 16px;
  }
  .my-id-label {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .my-id-value {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: .06em;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    word-break: break-all;
  }
  .copy-btn {
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s;
    flex-shrink: 0;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }

  .share-link-box {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 16px 24px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .share-link-text {
    font-size: 12px;
    color: var(--muted);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .divider {
    width: 100%;
    max-width: 400px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    color: var(--muted);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border2);
  }

  .call-input-wrap {
    width: 100%;
    max-width: 400px;
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  input[type=text] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 14px 18px;
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color .2s;
    min-width: 0;
  }
  input[type=text]::placeholder { color: var(--muted); font-family: var(--sans); font-size: 14px; }
  input[type=text]:focus { border-color: var(--accent); }

  .btn-call {
    background: var(--accent);
    border: none;
    border-radius: 12px;
    padding: 14px 22px;
    color: #fff;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-call:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-call:disabled { opacity: .4; transform: none; cursor: not-allowed; }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    border: 1px solid var(--border2);
    color: var(--muted);
    margin-top: 8px;
    transition: all .3s;
  }
  .status-chip .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background .3s;
  }
  .status-chip.ready { color: var(--green); border-color: rgba(52,211,153,.25); }
  .status-chip.ready .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-chip.calling .dot { background: var(--accent2); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ---- CALL SCREEN ---- */
  #callScreen {
    padding: 0;
    justify-content: flex-end;
    background: #000;
  }

  #remoteVideo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #0a0a0f;
    z-index: 0;
  }

  #localVideo {
    position: fixed;
    top: 16px;
    right: 16px;
    width: clamp(100px, 28vw, 160px);
    aspect-ratio: 9/16;
    border-radius: 16px;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,.15);
    z-index: 10;
    background: #111;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
    transition: transform .2s;
  }
  #localVideo:active { transform: scale(.97); }

  .call-overlay {
    position: relative;
    z-index: 10;
    width: 100%;
    padding: 16px 16px max(24px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.85));
  }

  .call-info {
    text-align: center;
    margin-bottom: 20px;
  }
  .call-peer-id {
    font-family: var(--mono);
    font-size: 13px;
    color: rgba(255,255,255,.5);
    margin-bottom: 4px;
  }
  .call-timer {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: .06em;
    color: #fff;
  }

  .call-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
  }

  .ctrl {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(12px);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl:active { transform: scale(.92); }
  .ctrl.off { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.4); }
  .ctrl.end {
    width: 68px; height: 68px;
    background: var(--red);
    border-color: var(--red);
    font-size: 26px;
  }
  .ctrl.end:active { background: #dc2626; }

  /* Incoming call modal */
  #incomingModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(12px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  #incomingModal.show { opacity: 1; pointer-events: all; }

  .incoming-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 24px;
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    animation: slideUp .3s ease;
  }
  @keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }

  .incoming-avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin: 0 auto 16px;
    animation: ring 1.5s ease infinite;
  }
  @keyframes ring {
    0%,100%{box-shadow:0 0 0 0 rgba(124,111,247,.5)}
    50%{box-shadow:0 0 0 16px rgba(124,111,247,0)}
  }

  .incoming-title { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .incoming-id {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 28px;
    word-break: break-all;
  }

  .incoming-btns { display: flex; gap: 12px; }
  .btn-decline {
    flex: 1; padding: 14px;
    background: rgba(248,113,113,.15);
    border: 1px solid rgba(248,113,113,.3);
    border-radius: 12px;
    color: var(--red);
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-decline:hover { background: rgba(248,113,113,.25); }
  .btn-accept {
    flex: 1; padding: 14px;
    background: rgba(52,211,153,.15);
    border: 1px solid rgba(52,211,153,.3);
    border-radius: 12px;
    color: var(--green);
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-accept:hover { background: rgba(52,211,153,.25); }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--text);
    z-index: 999;
    opacity: 0;
    transition: all .3s;
    white-space: nowrap;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Loading spinner */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,.2);
    border-top-color: var(--accent2);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* Remote video placeholder */
  .remote-placeholder {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 1;
    color: rgba(255,255,255,.3);
    font-size: 14px;
    pointer-events: none;
  }
  .remote-placeholder .big-dot {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }

  @media (max-width: 480px) {
    .call-controls { gap: 12px; }
    .ctrl { width: 50px; height: 50px; font-size: 20px; }
    .ctrl.end { width: 62px; height: 62px; }
  }
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div class="screen" id="homeScreen">
  <div class="logo">Vibe Call</div>
  <h1 class="home-headline">Call anyone,<br><em>anywhere.</em></h1>
  <p class="home-sub">Peer-to-peer · No account · No server</p>

  <div class="my-id-box">
    <div class="my-id-label">Your ID</div>
    <div class="my-id-value">
      <span id="myIdDisplay"><span class="spinner"></span></span>
      <button class="copy-btn" id="copyIdBtn" onclick="copyMyId()">Copy</button>
    </div>
  </div>

  <div class="share-link-box" id="shareLinkBox" style="display:none">
    <span class="share-link-text" id="shareLinkText"></span>
    <button class="copy-btn" id="copyLinkBtn" onclick="copyLink()">Copy link</button>
  </div>

  <div class="divider" style="max-width:400px;width:100%">gọi cho người khác</div>

  <div class="call-input-wrap">
    <input type="text" id="peerIdInput" placeholder="Nhập ID của người kia..." autocomplete="off" autocorrect="off" spellcheck="false" />
    <button class="btn-call" id="callBtn" onclick="startCall()" disabled>Gọi</button>
  </div>

  <div class="status-chip" id="statusChip">
    <div class="dot"></div>
    <span id="statusText">Đang kết nối...</span>
  </div>
</div>

<!-- CALL SCREEN -->
<div class="screen hidden" id="callScreen">
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="remote-placeholder" id="remotePlaceholder">
    <div class="big-dot">👤</div>
    <span>Đang chờ video...</span>
  </div>
  <video id="localVideo" autoplay muted playsinline></video>

  <div class="call-overlay">
    <div class="call-info">
      <div class="call-peer-id" id="callPeerId"></div>
      <div class="call-timer" id="callTimer">00:00</div>
    </div>
    <div class="call-controls">
      <button class="ctrl" id="micBtn" onclick="toggleMic()" title="Mic">🎤</button>
      <button class="ctrl end" onclick="endCall()" title="End">📵</button>
      <button class="ctrl" id="camBtn" onclick="toggleCam()" title="Camera">📷</button>
    </div>
  </div>
</div>

<!-- INCOMING MODAL -->
<div id="incomingModal">
  <div class="incoming-card">
    <div class="incoming-avatar">📞</div>
    <div class="incoming-title">Cuộc gọi đến từ</div>
    <div class="incoming-id" id="incomingId"></div>
    <div class="incoming-btns">
      <button class="btn-decline" onclick="declineCall()">Từ chối</button>
      <button class="btn-accept" onclick="acceptCall()">Nghe máy</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ---- STATE ----
let peer, localStream, currentCall;
let micOn = true, camOn = true;
let timerInterval, callSeconds = 0;
let pendingCall = null;
let myId = null;

// ---- INIT ----
async function init() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = localStream;
  } catch(e) {
    showToast('Không thể truy cập camera/mic: ' + e.message);
  }

  // Check for ?id= in URL (someone shared a link to call me)
  const params = new URLSearchParams(location.search);
  const targetId = params.get('call');

  peer = new Peer(undefined, {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443?transport=tcp',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    }
  });

  peer.on('open', id => {
    myId = id;
    document.getElementById('myIdDisplay').textContent = id;
    document.getElementById('callBtn').disabled = false;

    const chip = document.getElementById('statusChip');
    chip.className = 'status-chip ready';
    document.getElementById('statusText').textContent = 'Sẵn sàng';

    // Share link
    const link = location.origin + location.pathname + '?call=' + id;
    document.getElementById('shareLinkText').textContent = link;
    document.getElementById('shareLinkBox').style.display = 'flex';

    // Auto-fill if opened via share link
    if (targetId) {
      document.getElementById('peerIdInput').value = targetId;
      setTimeout(() => startCall(), 800);
    }
  });

  peer.on('call', incomingCall => {
    pendingCall = incomingCall;
    document.getElementById('incomingId').textContent = incomingCall.peer;
    document.getElementById('incomingModal').classList.add('show');
  });

  peer.on('error', e => {
    showToast('Lỗi: ' + e.message);
    setStatus('Lỗi kết nối', false);
    document.getElementById('statusChip').className = 'status-chip';
    document.getElementById('statusText').textContent = 'Lỗi — thử tải lại trang';
  });

  peer.on('disconnected', () => peer.reconnect());
}

// ---- CALL ----
function startCall() {
  const id = document.getElementById('peerIdInput').value.trim();
  if (!id) { showToast('Nhập ID của người kia'); return; }
  if (id === myId) { showToast('Không thể gọi cho chính mình!'); return; }
  if (!localStream) { showToast('Chưa có camera/mic'); return; }

  const chip = document.getElementById('statusChip');
  chip.className = 'status-chip calling';
  document.getElementById('statusText').textContent = 'Đang gọi...';
  document.getElementById('callBtn').disabled = true;

  const call = peer.call(id, localStream);
  currentCall = call;
  document.getElementById('callPeerId').textContent = id;

  call.on('stream', remoteStream => {
    connectRemote(remoteStream);
    showCallScreen();
  });

  call.on('close', () => endCall());
  call.on('error', e => { showToast('Lỗi cuộc gọi: ' + e.message); endCall(); });

  // Timeout if no answer
  setTimeout(() => {
    if (currentCall && !document.getElementById('callScreen').classList.contains('hidden') === false) {
      // Still on home, no answer
    }
  }, 30000);
}

function acceptCall() {
  document.getElementById('incomingModal').classList.remove('show');
  if (!pendingCall || !localStream) return;

  currentCall = pendingCall;
  pendingCall.answer(localStream);
  document.getElementById('callPeerId').textContent = pendingCall.peer;

  pendingCall.on('stream', remoteStream => {
    connectRemote(remoteStream);
    showCallScreen();
  });
  pendingCall.on('close', () => endCall());
  pendingCall.on('error', e => { showToast('Lỗi: ' + e.message); endCall(); });
  pendingCall = null;
}

function declineCall() {
  document.getElementById('incomingModal').classList.remove('show');
  if (pendingCall) { pendingCall.close(); pendingCall = null; }
}

function connectRemote(stream) {
  const rv = document.getElementById('remoteVideo');
  rv.srcObject = stream;
  rv.onloadedmetadata = () => {
    document.getElementById('remotePlaceholder').style.display = 'none';
  };
}

function showCallScreen() {
  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('callScreen').classList.remove('hidden');
  startTimer();
}

function endCall() {
  if (currentCall) { currentCall.close(); currentCall = null; }
  stopTimer();
  document.getElementById('remotePlaceholder').style.display = 'flex';
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('callScreen').classList.add('hidden');
  document.getElementById('homeScreen').classList.remove('hidden');

  const chip = document.getElementById('statusChip');
  chip.className = 'status-chip ready';
  document.getElementById('statusText').textContent = 'Sẵn sàng';
  document.getElementById('callBtn').disabled = false;
  showToast('Cuộc gọi đã kết thúc');
}

// ---- CONTROLS ----
function toggleMic() {
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  const btn = document.getElementById('micBtn');
  btn.textContent = micOn ? '🎤' : '🔇';
  btn.className = micOn ? 'ctrl' : 'ctrl off';
}

function toggleCam() {
  camOn = !camOn;
  localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  const btn = document.getElementById('camBtn');
  btn.textContent = camOn ? '📷' : '🚫';
  btn.className = camOn ? 'ctrl' : 'ctrl off';
}

// ---- TIMER ----
function startTimer() {
  callSeconds = 0;
  timerInterval = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    document.getElementById('callTimer').textContent = m + ':' + s;
  }, 1000);
}
function stopTimer() {
  clearInterval(timerInterval);
  document.getElementById('callTimer').textContent = '00:00';
}

// ---- COPY ----
function copyMyId() {
  if (!myId) return;
  navigator.clipboard.writeText(myId).then(() => {
    const btn = document.getElementById('copyIdBtn');
    btn.textContent = 'Đã copy!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function copyLink() {
  const link = document.getElementById('shareLinkText').textContent;
  navigator.clipboard.writeText(link).then(() => {
    const btn = document.getElementById('copyLinkBtn');
    btn.textContent = 'Đã copy!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy link'; btn.classList.remove('copied'); }, 2000);
    showToast('Đã copy link! Gửi cho người kia để họ gọi cho bạn.');
  });
}

// ---- TOAST ----
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// Swap local/remote video tap (mobile UX)
document.getElementById('localVideo').addEventListener('click', () => {
  const lv = document.getElementById('localVideo');
  const rv = document.getElementById('remoteVideo');
  const tmp = lv.srcObject;
  lv.srcObject = rv.srcObject;
  rv.srcObject = tmp;
});

// Enter key to call
document.getElementById('peerIdInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startCall();
});

init();
</script>
